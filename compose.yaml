name: meteocentro-dev
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: meteocentro
      POSTGRES_USER: meteocentro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteocentro -d meteocentro"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deploy/containers/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://meteocentro:${POSTGRES_PASSWORD}@db:5432/meteocentro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/containers/api.Dockerfile
    environment:
      PRIVATE_READ: ${PRIVATE_READ:-true}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SESSION_HOURS: ${SESSION_HOURS:-8760}
      HISTORY_COVERAGE_THRESHOLD: ${HISTORY_COVERAGE_THRESHOLD:-0.9}
      DATABASE_URL: postgresql+psycopg://meteocentro:${POSTGRES_PASSWORD}@db:5432/meteocentro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:24.21.0-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      # Preserve the relative import from frontend/src/WeatherMap.tsx.
      - ./config/provinces.geojson:/app/config/provinces.geojson:ro
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

  worker:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: deploy/containers/api.Dockerfile
    command: ["python", "-m", "meteocentro.worker"]
    restart: unless-stopped
    environment:
      HISTORY_DAILY_HTTP_BUDGET: ${HISTORY_DAILY_HTTP_BUDGET:-20}
      HISTORY_COVERAGE_THRESHOLD: ${HISTORY_COVERAGE_THRESHOLD:-0.9}
      DETAIL_RETENTION_MONTHS: ${DETAIL_RETENTION_MONTHS:-24}
      DATABASE_URL: postgresql+psycopg://meteocentro:${POSTGRES_PASSWORD}@db:5432/meteocentro
      AEMET_ENABLED: ${AEMET_ENABLED:-true}
      METEOCLIMATIC_ENABLED: ${METEOCLIMATIC_ENABLED:-false}
      METEOCLIMATIC_TERMS_REFERENCE: ${METEOCLIMATIC_TERMS_REFERENCE:-}
      METEOCLIMATIC_POLL_SECONDS: ${METEOCLIMATIC_POLL_SECONDS:-900}
      METEOCLIMATIC_DAILY_HTTP_BUDGET: ${METEOCLIMATIC_DAILY_HTTP_BUDGET:-300}
      METEOCLIMATIC_CURRENT_RESERVE: ${METEOCLIMATIC_CURRENT_RESERVE:-110}
      METEOCLIMATIC_MINUTE_HTTP_BUDGET: ${METEOCLIMATIC_MINUTE_HTTP_BUDGET:-20}
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      AEMET_POLL_SECONDS: ${AEMET_POLL_SECONDS:-900}
      AEMET_DAILY_HTTP_BUDGET: ${AEMET_DAILY_HTTP_BUDGET:-400}
      AEMET_CURRENT_RESERVE: ${AEMET_CURRENT_RESERVE:-220}
      AEMET_MINUTE_HTTP_BUDGET: ${AEMET_MINUTE_HTTP_BUDGET:-20}
      AEMET_CONCURRENCY: ${AEMET_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  frontend_node_modules:
