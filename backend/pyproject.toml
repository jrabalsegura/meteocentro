[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meteocentro"
version = "0.1.0"
description = "API and shared domain for Meteocentro"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.141,<0.142",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "shapely>=2.1,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/meteocentro"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
