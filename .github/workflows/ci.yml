name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar las imágenes comprobadas en GHCR (no despliega)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: meteocentro
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: meteocentro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meteocentro -d meteocentro_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://meteocentro:ci_only_password@127.0.0.1:5432/meteocentro_test
      DATABASE_URL: postgresql+psycopg://meteocentro:ci_only_password@127.0.0.1:5432/meteocentro_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
      - name: Install locked backend
        run: uv sync --locked --python python3.13
        working-directory: backend
      - name: Lint and format
        run: |
          backend/.venv/bin/ruff check backend/src tests/conftest.py tests/test_phase1.py tests/test_phase2.py tests/test_phase3.py tests/test_phase4.py tests/test_phase5.py tests/test_phase6.py tests/test_phase7.py
          backend/.venv/bin/ruff format --check backend/src tests/conftest.py tests/test_phase1.py tests/test_phase2.py tests/test_phase3.py tests/test_phase4.py tests/test_phase5.py tests/test_phase6.py tests/test_phase7.py
      - name: Migrations and tests on PostgreSQL
        run: |
          backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/alembic -c backend/alembic.ini check
          backend/.venv/bin/pytest tests/test_phase1.py tests/test_phase2.py tests/test_phase3.py tests/test_phase4.py tests/test_phase5.py tests/test_phase6.py tests/test_phase7.py -q
          python3 -m unittest discover -s tests -p test_phase0.py
          python3 -m unittest discover -s tests -p test_deploy.py
          backend/.venv/bin/ruff check --config backend/pyproject.toml deploy/scripts tests/test_deploy.py tests/seed_phase7.py

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build exact commit, with immutable base images
        run: python3 deploy/scripts/build.py --engine docker --platform linux/amd64 --output runtime/ci-images.json
      - name: Render and validate Quadlet 4.9.3
        run: |
          python3 deploy/scripts/ops.py prepare --images runtime/ci-images.json --output runtime/ci-release --domain meteocentro.example.invalid --config-dir /home/meteocentro/.config/meteocentro
          docker run --rm --network none -e QUADLET_UNIT_DIRS=/units -v "$PWD/runtime/ci-release/quadlet:/units:ro" --entrypoint /usr/lib/systemd/system-generators/podman-system-generator quay.io/podman/stable:v4.9.3@sha256:cc3563b15b511b3e84d23dc04087cf06df5dee8146c3834c652bd217d4ace1cd --user --dryrun > runtime/quadlet.txt
          test "$(grep -c '^---meteocentro.*\.service---$' runtime/quadlet.txt)" -eq 6
      - name: Isolated migration, containers, backup and restore
        run: python3 -u deploy/scripts/rehearse.py --images runtime/ci-images.json --output runtime/ci-rehearsal
      - name: Publish only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 deploy/scripts/publish.py --images runtime/ci-images.json --repository "$GITHUB_REPOSITORY" --output runtime/ghcr-images.json
          docker logout ghcr.io
      - name: Save manifests and non-secret validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteocentro-release-${{ github.sha }}
          path: |
            runtime/ci-images.json
            runtime/ghcr-images.json
            runtime/ci-rehearsal/result.json
            runtime/quadlet.txt
          retention-days: 14
